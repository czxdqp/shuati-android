name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMGR" ]; then echo "未找到 sdkmanager"; ls -la "$SDK_ROOT"; exit 1; fi
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV
          echo "sdkmanager: $SDKMGR"
          "$SDKMGR" --version

      - name: Install platform and build tools
        run: |
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "已安装:"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Sync web app into assets
        run: |
          # 以根目录的构建产物为准，避免 assets 里的副本忘记同步
          if [ -f "刷题助手.html" ]; then
            cp "刷题助手.html" android/app/src/main/assets/index.html
          fi
          ls -lh android/app/src/main/assets/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/shuati-assistant.apk
          ls -lh dist/
          md5sum dist/shuati-assistant.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shuati-apk
          path: dist/shuati-assistant.apk
          retention-days: 90
