server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/shuati;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 单文件应用 1.6MB，gzip 后约 500KB，首屏差别很大
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 主文档不缓存，更新后刷新即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 应用需直连大模型 API（DeepSeek/Kimi/通义），
    # 这是浏览器发起的跨域请求，不经过本服务器，无需反向代理配置。

    access_log /var/log/nginx/shuati.access.log;
    error_log  /var/log/nginx/shuati.error.log;
}
